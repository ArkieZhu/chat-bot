<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama Chat - 本地大模型对话</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body data-theme="dark">
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <span>Llama Chat</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="chatApp.toggleTheme()" title="切换主题">
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <button class="new-chat-btn" onclick="chatApp.newChat()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        新建对话
                    </button>
                </div>
            </div>

            <!-- 模型选择 -->
            <div class="model-section">
                <h3>当前模型</h3>
                <select id="modelSelect" class="model-select">
                    <option value="">加载中...</option>
                </select>
                <button class="refresh-models-btn" onclick="chatApp.loadModels()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    刷新模型列表
                </button>
            </div>

            <!-- 对话历史 -->
            <div class="history-section">
                <h3>对话历史</h3>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="搜索对话..." oninput="chatApp.searchChats(this.value)">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="history-list" id="historyList">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 设置按钮 -->
            <div class="sidebar-footer">
                <button class="settings-btn" onclick="chatApp.toggleSettings()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    参数设置
                </button>
                <div class="server-status" id="serverStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">检测中...</span>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 移动端菜单按钮 -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="chatApp.toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <!-- 设置面板 -->
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-header">
                    <h3>生成参数设置</h3>
                    <button class="close-settings" onclick="chatApp.toggleSettings()">×</button>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <label>
                            <span>Temperature</span>
                            <span class="value" id="temperatureValue">0.7</span>
                        </label>
                        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                        <small>控制输出的随机性，越高越创意</small>
                    </div>
                    <div class="setting-item">
                        <label>
                            <span>Max Tokens</span>
                            <span class="value" id="maxTokensValue">2048</span>
                        </label>
                        <input type="range" id="maxTokens" min="128" max="8192" step="128" value="2048">
                        <small>生成文本的最大长度</small>
                    </div>
                    <div class="setting-item">
                        <label>
                            <span>Top P</span>
                            <span class="value" id="topPValue">0.9</span>
                        </label>
                        <input type="range" id="topP" min="0" max="1" step="0.05" value="0.9">
                        <small>核采样概率阈值</small>
                    </div>
                    <div class="setting-item">
                        <label>
                            <span>Top K</span>
                            <span class="value" id="topKValue">40</span>
                        </label>
                        <input type="range" id="topK" min="1" max="100" step="1" value="40">
                        <small>Top-K 采样限制</small>
                    </div>
                    <div class="setting-item">
                        <label>
                            <span>Repeat Penalty</span>
                            <span class="value" id="repeatPenaltyValue">1.1</span>
                        </label>
                        <input type="range" id="repeatPenalty" min="1" max="2" step="0.05" value="1.1">
                        <small>重复惩罚系数</small>
                    </div>
                    <div class="setting-item">
                        <label>系统提示词 (System Prompt)</label>
                        <textarea id="systemPrompt" rows="4" placeholder="输入系统提示词，定义AI的角色和行为...">你是一个 helpful assistant。</textarea>
                    </div>
                    <div class="setting-item">
                        <label>API 地址</label>
                        <input type="text" id="apiUrl" value="http://127.0.0.1:8080" placeholder="http://127.0.0.1:8080">
                        <small>llama.cpp 服务的地址</small>
                    </div>
                    <div class="setting-item">
                        <label>
                            <span>Token 价格 ($/1M tokens)</span>
                            <span class="value" id="tokenPriceValue">0</span>
                        </label>
                        <input type="range" id="tokenPrice" min="0" max="10" step="0.1" value="0">
                        <small>设置 Token 单价用于估算成本（0 表示不估算）</small>
                    </div>
                </div>
            </div>

            <!-- 对话区域 -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-content">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <h1>欢迎使用 Llama Chat</h1>
                        <p>本地部署的大模型对话界面</p>
                        <div class="quick-actions">
                            <button onclick="chatApp.sendQuickMessage('你好，请介绍一下你自己')">
                                <span>👋</span> 自我介绍
                            </button>
                            <button onclick="chatApp.sendQuickMessage('请帮我写一段Python代码，实现快速排序')">
                                <span>💻</span> 写代码
                            </button>
                            <button onclick="chatApp.sendQuickMessage('请解释什么是机器学习')">
                                <span>🧠</span> 解释概念
                            </button>
                            <button onclick="chatApp.sendQuickMessage('请帮我翻译这段文字成英文')">
                                <span>🌐</span> 翻译文本
                            </button>
                        </div>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <!-- 文件预览区域 -->
                <div class="attachments-preview" id="attachmentsPreview" style="display:none;"></div>

                <div class="input-container">
                    <button class="attach-btn" id="attachBtn" onclick="chatApp.triggerFileInput()" title="添加附件">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.doc,.docx" multiple onchange="chatApp.handleFileSelect(this.files)">
                    <textarea 
                        id="messageInput" 
                        placeholder="输入消息... (Shift+Enter 换行, Enter 发送)"
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="chatApp.sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    <div class="model-info-container">
                        <span class="model-info" id="modelInfo">未连接</span>
                        <span class="context-info" id="contextInfo">上下文: 0 / 200k</span>
                        <span class="cost-info" id="costInfo" style="display:none;">$0.00</span>
                    </div>
                    <span class="shortcut-hint">Enter 发送 · Shift+Enter 换行</span>
                </div>
            </div>
        </main>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay" onclick="chatApp.closeSettings()"></div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
